[project]
name = "mcp-a2a-project"
version = "0.1.0"
description = "Multi-agent orchestration system combining A2A protocol with MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk>=0.3.16",
    "asyncclick>=8.3.0.7",
    "google-adk>=1.18.0",
    "mcp[cli]>=1.21.1",
    "python-dotenv>=1.0.0",
    "rich>=14.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
